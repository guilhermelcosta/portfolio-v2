name: Update Resume and Open PR

on:
  push:
    branches:
      - 'update/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: resume-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils pandoc

      - name: Run resume converter script
        run: python .github/scripts/update_resume.py

      - name: Commit generated Markdown
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update resume from latest rev"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request to master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base master \
            --head "${{ github.ref_name }}" \
            --title "Update resume (${{ github.ref_name }})" \
            --body "PR gerado automaticamente pelo workflow de atualização de currículo. O deploy no GitHub Pages acontece ao fazer merge deste PR na master." \
            || echo "PR já existe para essa branch, pulando criação."
